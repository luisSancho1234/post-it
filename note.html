<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Post-it</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    --note-color: #fff176;
    --ink: rgba(19, 24, 32, 0.86);
    --muted-ink: rgba(19, 24, 32, 0.58);
    background: transparent;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 7px;
  }
  .note-shell {
    position: relative;
    isolation: isolate;
    display: flex;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.62);
    border-radius: 22px;
    background:
      radial-gradient(circle at 12% 0%, rgba(255, 255, 255, 0.78), transparent 34%),
      radial-gradient(circle at 95% 100%, color-mix(in srgb, var(--note-color) 82%, transparent), transparent 62%),
      color-mix(in srgb, var(--note-color) 56%, rgba(255, 255, 255, 0.46));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.82),
      inset 0 -1px 0 rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(24px) saturate(145%);
    -webkit-backdrop-filter: blur(24px) saturate(145%);
  }
  .note-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(125deg, rgba(255, 255, 255, 0.28), transparent 32%, transparent 68%, rgba(255, 255, 255, 0.12));
  }
  .note-shell::after {
    content: "";
    position: absolute;
    inset: 1px;
    z-index: -1;
    pointer-events: none;
    border-radius: 21px;
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.48);
  }
  #bar {
    height: 44px;
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px 4px;
    -webkit-app-region: drag;
    user-select: none;
  }
  #bar .spacer { flex: 1; }
  button {
    -webkit-app-region: no-drag;
    width: 29px; height: 29px;
    border: none;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.2);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    color: var(--ink);
    font: 600 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    line-height: 1;
    cursor: pointer;
    opacity: 0.72;
    transition: transform 140ms ease, background 140ms ease, opacity 140ms ease, box-shadow 140ms ease;
  }
  button:hover { background: rgba(255, 255, 255, 0.5); opacity: 1; transform: translateY(-1px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.56), 0 4px 10px rgba(25, 34, 48, 0.1); }
  button:active { transform: scale(0.92); }
  button.on { opacity: 1; background: rgba(255, 255, 255, 0.62); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.68), 0 3px 9px rgba(25, 34, 48, 0.12); }
  #del:hover { background: rgba(255, 95, 86, 0.82); color: #fff; }
  #text {
    flex: 1;
    width: 100%;
    min-height: 0;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 8px 17px 17px;
    caret-color: currentColor;
  }
  #text::placeholder { color: var(--muted-ink); opacity: 1; }
  #text::selection { background: rgba(255, 255, 255, 0.55); }
  #palette {
    display: none;
    flex: 0 0 auto;
    gap: 9px;
    padding: 10px 13px 12px;
    background: rgba(255, 255, 255, 0.18);
    border-top: 1px solid rgba(255, 255, 255, 0.34);
    flex-wrap: wrap;
  }
  #palette.open { display: flex; }
  .dot {
    -webkit-app-region: no-drag;
    width: 21px; height: 21px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.72);
    box-shadow: 0 1px 4px rgba(20, 28, 40, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.45);
    cursor: pointer;
    padding: 0;
    opacity: 1;
  }
  .dot:hover { transform: scale(1.16); }
  @media (prefers-reduced-motion: reduce) {
    button, .dot { transition: none; }
  }
</style>
</head>
<body>
  <div class="note-shell">
    <div id="bar">
      <button id="new" title="Nova nota" aria-label="Nova nota">+</button>
      <button id="color" title="Cor" aria-label="Escolher cor">◌</button>
      <button id="smaller" title="Diminuir letra" aria-label="Diminuir letra">A−</button>
      <button id="bigger" title="Aumentar letra" aria-label="Aumentar letra">A+</button>
      <div class="spacer"></div>
      <button id="pin" title="Fixar por cima das outras janelas" aria-label="Fixar por cima">⌖</button>
      <button id="del" title="Apagar nota" aria-label="Apagar nota">×</button>
    </div>
    <div id="palette"></div>
    <textarea id="text" placeholder="Escreva aqui..." spellcheck="false"></textarea>
  </div>

<script>
  const id = new URLSearchParams(location.search).get('id');
  const $ = (s) => document.querySelector(s);
  const text = $('#text');
  let note = null;
  let timer = null;

  function applyColor(c) {
    document.body.style.setProperty('--note-color', c);
  }
  function applyFont(n) { text.style.fontSize = n + 'px'; }

  function flush() {
    clearTimeout(timer);
    window.postit.update(id, { text: text.value });
  }

  async function init() {
    note = await window.postit.getNote(id);
    if (!note) return;
    text.value = note.text || '';
    applyColor(note.color);
    applyFont(note.fontSize || 15);
    $('#pin').classList.toggle('on', !!note.pinned);

    const colors = await window.postit.getColors();
    const pal = $('#palette');
    colors.forEach((c) => {
      const d = document.createElement('button');
      d.className = 'dot';
      d.style.background = c;
      d.title = c;
      d.addEventListener('click', () => {
        note.color = c;
        applyColor(c);
        window.postit.update(id, { color: c });
        pal.classList.remove('open');
      });
      pal.appendChild(d);
    });
    text.focus();
  }

  text.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(flush, 300);
  });
  window.addEventListener('beforeunload', flush);
  window.addEventListener('blur', flush);

  $('#new').addEventListener('click', () => window.postit.newNote());
  $('#color').addEventListener('click', () => $('#palette').classList.toggle('open'));
  $('#smaller').addEventListener('click', () => {
    note.fontSize = Math.max(10, (note.fontSize || 15) - 1);
    applyFont(note.fontSize);
    window.postit.update(id, { fontSize: note.fontSize });
  });
  $('#bigger').addEventListener('click', () => {
    note.fontSize = Math.min(32, (note.fontSize || 15) + 1);
    applyFont(note.fontSize);
    window.postit.update(id, { fontSize: note.fontSize });
  });
  $('#pin').addEventListener('click', async () => {
    const pinned = await window.postit.togglePin(id);
    $('#pin').classList.toggle('on', pinned);
  });
  $('#del').addEventListener('click', () => {
    if (text.value.trim() === '' || confirm('Apagar esta nota?')) {
      window.postit.deleteNote(id);
    }
  });

  init();
</script>
</body>
</html>
