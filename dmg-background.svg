<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="0.52" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#e7ebf5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b9e9ff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#74bdf0" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8a8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd875" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd4e1" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ed9fc3" stop-opacity=".52"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#46526c" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="660" height="420" rx="18" fill="url(#bg)"/>
  <circle cx="82" cy="76" r="120" fill="#b8d7ff" opacity=".22" filter="url(#blur)"/>
  <circle cx="594" cy="335" r="145" fill="#d7c6ff" opacity=".2" filter="url(#blur)"/>

  <!-- Soft background notes, intentionally kept away from the install controls. -->
  <g filter="url(#shadow)" opacity=".78">
    <g transform="translate(46 62) rotate(-9 78 66)">
      <rect width="156" height="132" rx="18" fill="url(#blue)" stroke="#fff" stroke-opacity=".68"/>
      <path d="M22 38h82M22 56h107M22 74h88" stroke="#406985" stroke-opacity=".34" stroke-width="5" stroke-linecap="round"/>
      <circle cx="123" cy="102" r="13" fill="#fff" opacity=".38"/>
    </g>
    <g transform="translate(470 54) rotate(10 72 68)">
      <rect width="144" height="136" rx="18" fill="url(#pink)" stroke="#fff" stroke-opacity=".68"/>
      <path d="M22 39h75M22 57h98M22 75h65" stroke="#874b6a" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>
      <path d="M105 103l11 11 20-24" fill="none" stroke="#874b6a" stroke-opacity=".42" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(250 16) rotate(4 70 60)">
      <rect width="140" height="120" rx="18" fill="url(#yellow)" stroke="#fff" stroke-opacity=".7"/>
      <path d="M22 35h82M22 54h96M22 73h74" stroke="#866c34" stroke-opacity=".3" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <path d="M258 223h144" stroke="#63718a" stroke-opacity=".32" stroke-width="2" stroke-dasharray="6 8"/>
  <path d="M390 217l12 6-12 6" fill="none" stroke="#63718a" stroke-opacity=".38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="270" text-anchor="middle" fill="#42506a" fill-opacity=".62" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="14" font-weight="600" letter-spacing=".2">Drag to Applications</text>
</svg>
